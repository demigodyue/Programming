# nginx server block for the deployed site.
#
# nginx does NOT read .htaccess. Every rule in this project's .htaccess
# files is therefore reproduced here, and the deny rules are the reason
# this file matters: on a default nginx setup, api/config.php would be
# served as an empty 200 at best, and sql/schema.sql as plain text —
# handing over the table structure for free.
#
# Adjust server_name, root, and the fastcgi_pass socket, then:
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Everything except the ACME challenge goes to HTTPS. The session
    # cookie's Secure flag is set from the scheme (see api/bootstrap.php),
    # so signing in over plain http silently drops the cookie.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/nepal;
    index index.html;

    # --- security headers -------------------------------------------------
    # frame-ancestors, nosniff and HSTS cannot be delivered by the
    # <meta http-equiv> CSP the pages already carry — they only work as
    # real headers, which is what this block is for.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- things that must never be served ---------------------------------
    # These four blocks are the .htaccess equivalents. Note nginx picks ONE
    # location, so these regex blocks are declared before the generic .php
    # handler below and win by being more specific.

    # Credentials and the shared include — reachable only via require().
    location ~ ^/api/(config|config\.sample|bootstrap)\.php$ {
        deny all;
    }

    # The whole schema folder (mirrors sql/.htaccess).
    location ^~ /sql/ {
        deny all;
    }

    # Nav/footer fragments that build.pl inlines — build inputs, not pages.
    location ^~ /partials/ {
        deny all;
    }

    # Server config and the deploy runbook — never site content.
    location ^~ /deploy/ {
        deny all;
    }

    # The build script and project documentation.
    location ~ ^/(build\.pl|_headers)$ { deny all; }
    location ~ \.md$              { deny all; }

    # --- PHP --------------------------------------------------------------
    location ~ \.php$ {
        # Refuse anything that isn't a real file rather than letting
        # path-info tricks reach the interpreter.
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    # --- static -----------------------------------------------------------
    # Fonts are self-hosted and never change under these names.
    #
    # The security headers are repeated here on purpose: an add_header in a
    # nested block REPLACES the whole inherited set rather than adding to
    # it, so a block that declared only Cache-Control would silently serve
    # every .woff2 with no CSP and no nosniff.
    location /assets/fonts/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    autoindex off;
}
